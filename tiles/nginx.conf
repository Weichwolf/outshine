# fb-tiles' front door: nginx CACHES itself (proxy_cache) and only forwards misses to fb-tiles on
# 127.0.0.1:8082. Our bake/tile URLs are versioned-immutable (?v= in the URL, see bake.c
# style_ver.h) -- textbook cache-forever material, so the origin (fb-tiles) only ever sees a cold
# tile once, from wherever it's deployed centrally. This container is a single-service origin, not
# a multi-tenant box, so "user root" for the workers (they need write access to the SAME cache
# volume fb-tiles already writes bakes into) is a deliberate simplification, not an oversight.
user root;
worker_processes auto;
pid /run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    access_log    off;

    # Survives `podman rm/run` the same way fb-tiles' own bake_osm/bake_photo dirs do: it's a
    # subdirectory of the SAME mounted cache volume (-v fbtiles-cache:/var/cache/fbtiles), not a
    # second volume to remember to mount.
    proxy_cache_path /var/cache/fbtiles/nginx levels=1:2 keys_zone=fbtiles:50m max_size=5g
                      inactive=30d use_temp_path=off;

    # PNG/JPEG bake output is already deflated and does not compress twice. MVT does: it is bare
    # protobuf, and [MESS] z14/8617/5404 goes 152998 -> 89842 B at level 1 (1.70x) in 2.2 ms --
    # versatiles itself ships it gzipped, we were the ones handing it on raw.
    gzip on;
    gzip_types text/plain application/octet-stream application/vnd.mapbox-vector-tile;
    gzip_min_length 512;
    gzip_vary on;   # proxy_cache stores the origin's raw entity; downstream caches need the Vary

    upstream fbtiles_upstream {
        server 127.0.0.1:8082;
        keepalive 64;   # persistent connections to the origin -- fb-tiles' own Connection: close
                        # per response is fine, nginx's keepalive pool reconnects/reuses regardless.
    }

    server {
        listen 8081;

        # Live values, must never be served stale from cache.
        location = /health { proxy_pass http://fbtiles_upstream; proxy_cache off;
                              proxy_http_version 1.1; proxy_set_header Connection ""; }
        location = /elev   { proxy_pass http://fbtiles_upstream; proxy_cache off;
                              proxy_http_version 1.1; proxy_set_header Connection ""; }

        # /wx is the one cacheable route whose bytes are NOT immutable: a GFS cycle is superseded
        # every 6 h, so the origin computes the remaining life of the run it just served and states
        # it as Cache-Control: max-age. nginx honours a response's own Cache-Control ahead of
        # proxy_cache_valid, so the rule below is only the fallback for a response that somehow
        # carries none -- the origin is what decides when this expires. 503 gets no validity rule
        # at all, so an unreachable NOMADS can never be stored as weather (the /elev lesson).
        location = /wx {
            proxy_pass http://fbtiles_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache fbtiles;
            proxy_cache_key $uri;
            proxy_cache_valid 200 1h;
            proxy_cache_lock on;
            proxy_cache_lock_timeout 300s;
            proxy_read_timeout 300s;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        # Everything else (/bake/*, /t/*) is candidate cache material.
        location / {
            proxy_pass http://fbtiles_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_cache fbtiles;
            proxy_cache_key $uri$is_args$args;   # the ?v=/?tex= query IS part of tile identity

            # Only 200 and 404 get a validity rule below -> everything else (202, 500, 503) is
            # never cached, by omission -- no separate "don't cache 202" directive needed.
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 1m;

            # Collapses N concurrent misses of the SAME tile into ONE upstream request at the proxy
            # layer, ahead of fb-tiles' own per-tile inflight dedup (bakepool.c) -- belt and
            # suspenders, not redundant: this is the layer that matters once fb-tiles sits behind a
            # CDN with many edge-adjacent proxies. lock_timeout matches proxy_read_timeout: a long
            # cold bake must not make waiters give up and hit the origin themselves.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 300s;

            # No 202-fallback anymore on the origin (fb-tiles blocks until done) -- long cold bakes
            # (upstream vector fetch + raster + encode) must not be cut short by the proxy.
            proxy_read_timeout 300s;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        # TLS for central hosting: deferred, not implemented here. FB_DOMAIN (env, unused today)
        # is the intended hook -- a real deployment would add a second `server { listen 443 ssl; }`
        # block for that domain plus a cert (acme/certbot sidecar or a mounted cert pair); nginx has
        # no Caddy-style automatic ACME built in, so that's a separate piece of work, not a flag
        # flip. Left as a documented gap, not wired up, per the current task's scope.
    }
}
