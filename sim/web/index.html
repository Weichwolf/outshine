<!doctype html>
<html>
<head><meta charset="utf-8"><title>Outshine</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#000000">
<!-- The pedestrian bench: one declared scene (mods/demo/mod.json, preloaded into gpu.data) and
     nothing to choose. The canvas fills the viewport and says nothing about the picture's size: the
     scenario declares that, and the engine letterboxes into whatever this element turns out to be.
     object-fit:contain because the backing store is reconfigured with 8 px of hysteresis
     (render/Renderer.cpp SyncSwapSize) and may therefore differ from the CSS box by up to 7 device
     pixels in one axis; without it the browser stretches that difference into the letterbox. -->
<style>
html,body{margin:0;height:100%;background:#000;color:#c8d2c8;font:14px/1.45 ui-monospace,Menlo,Consolas,monospace}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="gpu"></canvas>
<script src="config.js"></script>
<script>
  // F = fullscreen.
  window.addEventListener('keydown', function(e){
    if(e.ctrlKey||e.metaKey||e.altKey||e.repeat) return;
    if(e.key==='f'||e.key==='F'){
      e.preventDefault(); var c=document.getElementById('gpu');
      var req=c.requestFullscreen||c.webkitRequestFullscreen;
      if(!document.fullscreenElement && !document.webkitFullscreenElement){ if(req) req.call(c); }
      else { (document.exitFullscreen||document.webkitExitFullscreen).call(document); }
    }
  });
</script>
<script src="gpu.js"></script>
</body>
</html>
