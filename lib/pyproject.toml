[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outshine-reference"
version = "0.1.0"
description = "Python reference contracts and procedures for Outshine generators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "shapely>=2.1,<3", "Pillow>=12,<13", "scipy>=1.15,<2"]

[project.optional-dependencies]
assets = ["trimesh>=5.1.1,<6", "pygltflib>=1.16.5,<2"]
transport = ["clarabel>=0.11,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outshine_ref = ["py.typed"]

