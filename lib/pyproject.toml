[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outshine-reference"
version = "0.1.0"
description = "Python reference contracts and procedures for Outshine generators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "shapely>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
outshine_ref = ["py.typed"]

