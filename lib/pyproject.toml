[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "outshine"
version = "0.1.0"
description = "Python reference contracts and procedures for Outshine generators"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "shapely>=2.1,<3", "Pillow>=12,<13", "scipy>=1.15,<2"]

[project.optional-dependencies]
assets = ["trimesh>=5.1.1,<6"]
transport = ["clarabel>=0.11,<1"]
water = ["clarabel>=0.11,<1", "osqp>=1,<2", "pyproj>=3.8,<4"]
roofs = ["py_straight_skeleton==0.1.0", "pysfcgal==2.3.0"]
solids = ["manifold3d==3.5.4"]
places = ["mapbox-vector-tile>=2.2,<3"]
atlas = ["rasterio>=1.4.3,<2", "pyshp>=3.1.9,<4"]
render = ["astral==3.2", "moderngl>=5.12,<6", "mapbox-vector-tile>=2.2,<3", "manifold3d==3.5.4", "clarabel>=0.11,<1", "osqp>=1,<2", "pyproj>=3.8,<4"]

[tool.setuptools.packages.find]
include = ["outshine*"]

[tool.setuptools.package-data]
outshine = ["py.typed", "vegetation/data/*.json", "rendering/shaders/*"]

